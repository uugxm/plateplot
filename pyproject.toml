[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "plateplot"
version = "0.1.0a6"
description = "Configurable well plate diagrams with vector SVG/PDF output"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pypdf>=5", "build>=1"]

[project.scripts]
plateplot = "plateplot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plateplot = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
